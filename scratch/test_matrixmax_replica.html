<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>matrixMAX Replica Test</title>
<style>
  body {
    background: #0F172A;
    color: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 30px;
  }
  .matrixmax-card {
    background: #FFFFFF;
    color: #1E293B;
    border-radius: 8px;
    padding: 24px 30px 30px 24px;
    display: inline-block;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .matrixmax-title {
    font-size: 18px;
    font-weight: 700;
    color: #2563EB;
    margin-bottom: 25px;
    letter-spacing: -0.3px;
  }
  .matrix-table {
    border-collapse: separate;
    border-spacing: 5px;
  }
  .th-host-corner {
    width: 140px;
    min-width: 140px;
  }
  .th-col-rotated {
    height: 85px;
    width: 28px;
    min-width: 28px;
    max-width: 28px;
    vertical-align: bottom;
    padding: 0;
    position: relative;
  }
  .th-col-text {
    transform: rotate(-45deg);
    transform-origin: left bottom;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    position: absolute;
    bottom: 6px;
    left: 10px;
    width: 90px;
    text-align: left;
  }
  .td-host {
    font-size: 13px;
    font-weight: 500;
    color: #334155;
    padding-right: 12px;
    white-space: nowrap;
    text-align: left;
    cursor: pointer;
  }
  .td-host:hover {
    color: #2563EB;
    font-weight: 600;
  }
  .maint-wrench {
    color: #F97316;
    margin-left: 4px;
    font-size: 13px;
  }
  .cell-tile {
    width: 26px;
    height: 26px;
    min-width: 26px;
    min-height: 26px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s ease, filter 0.1s ease;
  }
  .cell-tile:hover {
    transform: scale(1.2);
    box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  }
  /* Tile States matching uploaded matrixMAX screenshot */
  .cell-tile.ok {
    background: #4ADE80;
    color: #FFFFFF;
  }
  .cell-tile.empty {
    background: transparent;
    border: 1.5px solid #E2E8F0;
    color: transparent;
  }
  .cell-tile.info {
    background: #60A5FA;
    color: #FFFFFF;
    font-family: serif;
    font-style: italic;
    font-weight: bold;
  }
  .cell-tile.warning {
    background: #FCD34D;
    color: #78350F;
    border: 1px solid #F59E0B;
  }
  .cell-tile.average {
    background: #FB923C;
    color: #FFFFFF;
  }
  .cell-tile.high {
    background: #F87171;
    color: #FFFFFF;
  }
  .cell-tile.disaster {
    background: #EF4444;
    color: #FFFFFF;
  }
</style>
</head>
<body>

<div class="matrixmax-card">
  <div class="matrixmax-title">matrixMAX</div>
  <table class="matrix-table">
    <thead>
      <tr>
        <th class="th-host-corner"></th>
        <th class="th-col-rotated"><span class="th-col-text">web</span></th>
        <th class="th-col-rotated"><span class="th-col-text">api</span></th>
        <th class="th-col-rotated"><span class="th-col-text">cpu</span></th>
        <th class="th-col-rotated"><span class="th-col-text">memory</span></th>
        <th class="th-col-rotated"><span class="th-col-text">disk</span></th>
        <th class="th-col-rotated"><span class="th-col-text">network</span></th>
        <th class="th-col-rotated"><span class="th-col-text">dns</span></th>
        <th class="th-col-rotated"><span class="th-col-text">cert</span></th>
        <th class="th-col-rotated"><span class="th-col-text">vpn</span></th>
        <th class="th-col-rotated"><span class="th-col-text">mail</span></th>
        <th class="th-col-rotated"><span class="th-col-text">backup</span></th>
        <th class="th-col-rotated"><span class="th-col-text">replication</span></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="td-host">backup-01</td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile empty"></div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile high">!</div></td>
        <td><div class="cell-tile empty"></div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile info">i</div></td>
        <td><div class="cell-tile ok">✓</div></td>
      </tr>
      <tr>
        <td class="td-host">db-02 <span class="maint-wrench">🔧</span></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile average">↑</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile empty"></div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile empty"></div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile disaster">✕</div></td>
      </tr>
      <tr>
        <td class="td-host">fw-01</td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile empty"></div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile average">↑</div></td>
        <td><div class="cell-tile warning">▲</div></td>
        <td><div class="cell-tile average">↑</div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile empty"></div></td>
        <td><div class="cell-tile ok">✓</div></td>
        <td><div class="cell-tile ok">✓</div></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
